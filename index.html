<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan con Alfredo</title>
<meta name="description" content="Japan con Alfredo: hiragana, katakana e kanji scritti a mano">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan Alfredo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --ink:#1C1D24; --muted:#6B6E7B; --line:#E2DFD8;
  --accent:#2B3A6B; --accent-ink:#FFFFFF; --accent-soft:#E6E9F3; --sun:#C8402F;
  --ok:#24785A; --ok-soft:#DFF1E7; --bad:#BF4630; --bad-soft:#F8E3DD; --tip:#8A5A0B; --tip-soft:#FBF0D9;
  --grid:#D3CFC6; --ghost:#C3C9DA;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121318; --surface:#1B1D25; --ink:#E9EAF0; --muted:#9A9DAB; --line:#2C2F3B;
  --accent:#9EB0EE; --accent-ink:#121626; --accent-soft:#232A45; --sun:#E0604E;
  --ok:#5DC497; --ok-soft:#163128; --bad:#EE7D66; --bad-soft:#3A201B; --tip:#E8BD62; --tip-soft:#3A2E14;
  --grid:#383B48; --ghost:#3E4766; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121318; --surface:#1B1D25; --ink:#E9EAF0; --muted:#9A9DAB; --line:#2C2F3B;
  --accent:#9EB0EE; --accent-ink:#121626; --accent-soft:#232A45; --sun:#E0604E;
  --ok:#5DC497; --ok-soft:#163128; --bad:#EE7D66; --bad-soft:#3A201B; --tip:#E8BD62; --tip-soft:#3A2E14;
  --grid:#383B48; --ghost:#3E4766; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation}
#app{max-width:1060px;margin:0 auto;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:28px}
.narrow{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.3;cursor:default}
h1,h2{margin:0;line-height:1.2}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;text-decoration:none;color:inherit;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grow{flex:1;max-width:260px}
.icon-btn{width:48px;height:48px;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn.plain{border-color:transparent;background:transparent}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:48px}
.topbar .title{font-weight:650;font-size:1.05rem}
.jpt{font-family:var(--f-kana);font-size:1.5rem;font-weight:600}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--accent);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}

/* logo */
.home-head{display:flex;align-items:center;gap:10px;margin:6px auto 18px}
.logo-btn{flex:1;min-width:0;display:flex;text-align:left;padding:4px 0;border-radius:12px}
.exbar{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:10px;margin-bottom:14px}
.tabs{justify-self:center;width:100%;max-width:460px;display:flex;padding:4px;gap:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tabs button{flex:1;min-width:0;min-height:48px;border-radius:12px;font-size:1rem;font-weight:650;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.exbar .count{display:flex;flex-direction:column;align-items:flex-end;font-size:.85rem;line-height:1.25}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}
.logo{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.logo .sun{width:44px;height:44px;border-radius:50%;background:var(--sun);flex:none}
.logo .lt{display:flex;flex-direction:column;min-width:0}
.logo .jp{font-family:var(--f-kana);font-weight:600;font-size:clamp(.9rem,4.1vw,1.45rem);line-height:1.15;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .en{font-size:.82rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/0.82;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:12px}
.tile .jp{font-family:var(--f-kana);font-size:clamp(1.7rem,7.5vw,2.6rem);font-weight:600;line-height:1.1}
.tile .lbl{font-size:.85rem;color:var(--muted);font-weight:500}
.tile:active{transform:scale(.985)}
.tile.wide{width:100%;aspect-ratio:auto;min-height:104px;margin-top:12px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.wide .lbl{color:var(--accent-ink);opacity:.8}

/* menu sezione */
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.choice .k{font-family:var(--f-kana);font-size:2.1rem;line-height:1;width:2.6rem;text-align:center;color:var(--accent);flex:none}
.choice .t{flex:1;min-width:0}.choice b{display:block;font-size:1.08rem}
.choice .sub{color:var(--muted);font-size:.88rem}
.choice svg{color:var(--muted)}

/* alfabeto */
.selbar{margin:-4px 0 4px}
.savebar{margin:6px 0 10px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.savebar .btn{min-height:50px;font-size:1.02rem}
.saved{font-size:.92rem;text-align:center;min-height:1.2em}
.saved.ok{color:var(--ok,#2e7d4f)}
.saved.bad{color:var(--bad,#c0392b)}
.sec{margin:20px 0 8px}.sec h2{font-size:.95rem;color:var(--muted);font-weight:600}
.arow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pick{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%}
.pick span{width:24px;height:24px;border-radius:50%;border:2px solid var(--grid);transition:background .12s,border-color .12s}
.arow.on .pick span{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.kt{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kt.y{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:520px){.kt.y{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kc{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px}
.kc .k{font-family:var(--f-kana);font-size:1.7rem;line-height:1.1}
.kc .r{font-size:.7rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.kgrid .kc .r{font-size:.82rem;color:var(--ink);white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.15}
.kc.empty{background:transparent;border-color:transparent}
.arow:not(.on) .kc:not(.empty){opacity:.5}
.credit{margin-top:22px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}

/* esercizi */
.quiz{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "fb" "pad"}
.quiz>.side{grid-area:side;min-width:0}.quiz>.padwrap,.quiz>.tools.solo{grid-area:pad}.quiz>.fbslot{grid-area:fb;min-width:0}
@media (min-width:860px) and (orientation:landscape){.quiz:not(.nopad){grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr);grid-template-areas:"side pad" "fb pad";align-items:start;grid-template-rows:auto 1fr}}
.quiz.nopad{max-width:620px;margin:0 auto}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.prompt .row{justify-content:center}
.prompt .big{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;line-height:1.05;letter-spacing:.02em}
.prompt .big.it{font-size:clamp(1.6rem,6vw,2.2rem)}
.prompt .sub{font-size:1.05rem;color:var(--muted);margin-top:-6px}
.prompt .ask{color:var(--muted);font-size:.9rem}
.bigk{font-family:var(--f-kana);font-size:clamp(5rem,26vw,8rem);line-height:1;text-align:center;font-weight:600}
.playbig{display:flex;align-items:center;justify-content:center;gap:12px;min-height:88px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:1.1rem}
.playbig svg{width:34px;height:34px}
.ans{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:1.1rem}
.ans[readonly]{opacity:.75}
.reveal{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line)}
.reveal .k{font-family:var(--f-kana);font-size:2rem;line-height:1.2}
.padwrap{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
canvas.pad{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;max-width:100%}
.tools{display:flex;gap:8px;justify-content:center;width:100%;flex-wrap:wrap}
.fb{border-radius:12px;padding:11px 14px;font-weight:550}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.tip{background:var(--tip-soft);color:var(--tip)}.fb.info{background:var(--accent-soft);color:var(--accent)}
.fbslot:empty{display:none}
@media (max-width:600px){.hide-phone{display:none}.prompt{padding:14px}}

/* scheda kana */
.sheet-head{display:flex;gap:16px;align-items:center}
.sheet-head .k{font-family:var(--f-kana);font-size:4.4rem;line-height:1;color:var(--accent)}
.sheet-head .t{flex:1;min-width:0}.sheet-head .r{font-size:1.35rem;font-weight:650}
.sheet-head .r.it{overflow-wrap:anywhere;margin-top:2px}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex .k{font-family:var(--f-kana);font-size:1.35rem;min-width:4.6em}.ex .t{flex:1;min-width:0}

/* in arrivo */
.soon{text-align:center;margin-top:14vh}.soon .k{font-family:var(--f-kana);font-size:4.5rem;font-weight:600;line-height:1.1}

/* impostazioni */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}.li .t{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.seg button{min-height:42px;padding:0 13px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.topbar .seg button{min-height:40px}
.sel{min-height:44px;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:.9rem}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{left:23px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:550;z-index:20;max-width:calc(100% - 32px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* login */
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px 24px;text-align:center}
.login .sun{width:54px;height:54px;border-radius:50%;background:var(--sun);margin:0 auto 12px}
.login h1{font-family:var(--f-kana);font-size:1.25rem;margin:0 0 4px}
.login input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:1rem;margin-top:10px}
.login .btn{width:100%;margin-top:12px}
.login .err{color:var(--bad);font-size:.9rem;margin-top:10px}.login .err:empty{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="login" id="login" hidden>
  <form class="card" id="login-form">
    <div class="sun" aria-hidden="true"></div>
    <h1>ジャパン・コン・アルフレード</h1>
    <p class="muted small">Accedi per avere righe, impostazioni e progressi uguali su iPhone, iPad e computer.</p>
    <input id="login-email" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" minlength="6" required>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn primary" type="submit">Accedi</button>
    <button class="btn" type="button" id="login-new">Crea l'account</button>
    <button class="linkbtn" type="button" id="login-skip" style="margin-top:14px">Continua senza account</button>
  </form>
</div>
<script src="config.js"></script>
<script type="module">
// Account Firebase: progetto "giappoconraoul". Dati in users/{uid}/hiragana/japan
const cfg=window.HIRA_FIREBASE;
if(cfg&&cfg.apiKey){
  const V='https://www.gstatic.com/firebasejs/12.19.0/';
  const $=id=>document.getElementById(id),box=$('login'),err=$('login-err');
  try{
    const [{initializeApp},A,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
    const MSG={'auth/invalid-credential':'Email o password sbagliate.','auth/wrong-password':'Password sbagliata.','auth/user-not-found':'Nessun account con questa email.','auth/email-already-in-use':'Esiste già un account con questa email: usa Accedi.','auth/weak-password':'Password troppo corta: almeno 6 caratteri.','auth/invalid-email':'Email non valida.','auth/network-request-failed':'Sei senza rete. Riprova, o continua senza account.','auth/too-many-requests':'Troppi tentativi. Riprova tra qualche minuto.'};
    const run=async fn=>{err.textContent='';const e=$('login-email').value.trim(),p=$('login-pass').value;if(!e||p.length<6){err.textContent='Scrivi email e password (almeno 6 caratteri).';return;}
      try{await fn(auth,e,p);}catch(x){err.textContent=MSG[x.code]||'Non riuscito ('+(x.code||'errore')+').';}};
    $('login-form').onsubmit=e=>{e.preventDefault();run(A.signInWithEmailAndPassword);};
    $('login-new').onclick=()=>run(A.createUserWithEmailAndPassword);
    $('login-skip').onclick=()=>{try{localStorage.setItem('jca-skip-login','1');}catch(e){}box.hidden=true;};
    window.JCA_AUTH={email:null,show:()=>{box.hidden=false;},signOut:()=>A.signOut(auth)};
    A.onAuthStateChanged(auth,u=>{
      window.JCA_AUTH.email=u?u.email:null;
      if(u){const ref=F.doc(db,'users',u.uid,'hiragana','japan');
        window.JCA_SYNC={get:async()=>{const s=await F.getDoc(ref);return s.exists()?s.data():null;},set:d=>F.setDoc(ref,d)};
        box.hidden=true;dispatchEvent(new Event('jca-sync-ready'));}
      else{window.JCA_SYNC=null;dispatchEvent(new Event('jca-signed-out'));let skip=false;try{skip=!!localStorage.getItem('jca-skip-login');}catch(e){}box.hidden=skip;}
    });
  }catch(e){console.warn('Firebase non raggiungibile: si lavora sul dispositivo',e);}
}
</script>
<script src="app.js?v=0b7fca00"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
