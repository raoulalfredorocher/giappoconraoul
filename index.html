<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hiragana">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#10131B" media="(prefers-color-scheme: dark)">

<style>[hidden]{display:none!important}body{margin:0}
.login,.login *{box-sizing:border-box}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 24px 26px;text-align:center;box-shadow:0 10px 40px rgba(20,30,60,.08)}
.login .g{font-family:var(--f-kana);font-size:3rem;color:var(--accent);line-height:1}
.login h1{font-size:1.3rem;margin:8px 0 4px}
.login input{box-sizing:border-box;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:1rem;margin-top:10px}
.login .btn{width:100%;margin-top:12px}
.login .err{color:var(--bad);font-size:.9rem;margin-top:10px}
.login .err:empty{display:none}
.login #login-go{margin-top:16px}
</style>
</head>
<body>
<title>Hiragana a mano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. Home = three big choices; quiz = prompt above a square writing pad (side by side on iPad landscape). */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1B2033; --muted:#646B80; --line:#DDE0E8;
  --accent:#2E4A8F; --accent-ink:#FFFFFF; --accent-soft:#E4E9F6;
  --ok:#24785A; --ok-soft:#DFF1E7; --bad:#BF4630; --bad-soft:#F8E3DD; --tip:#8A5A0B; --tip-soft:#FBF0D9;
  --grid:#CBD0DC; --ghost:#BCC5DD;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131B; --surface:#191D29; --ink:#E7EAF3; --muted:#9AA1B6; --line:#2B3042;
  --accent:#8FA8EC; --accent-ink:#0F1426; --accent-soft:#222B47;
  --ok:#5DC497; --ok-soft:#163128; --bad:#EE7D66; --bad-soft:#3A201B; --tip:#E8BD62; --tip-soft:#3A2E14;
  --grid:#363C51; --ghost:#3B4870; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131B; --surface:#191D29; --ink:#E7EAF3; --muted:#9AA1B6; --line:#2B3042;
  --accent:#8FA8EC; --accent-ink:#0F1426; --accent-soft:#222B47;
  --ok:#5DC497; --ok-soft:#163128; --bad:#EE7D66; --bad-soft:#3A201B; --tip:#E8BD62; --tip-soft:#3A2E14;
  --grid:#363C51; --ghost:#3B4870; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation}
#app{max-width:1060px;margin:0 auto;padding-block:12px 28px}
.narrow{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;line-height:1.2;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon-btn{width:48px;height:48px;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn.plain{border-color:transparent;background:transparent}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:48px}
.topbar .title{font-weight:650;font-size:1.05rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* home */
.home-head{display:flex;align-items:center;gap:14px;margin:8px 0 22px}
.home-head .glyph{font-family:var(--f-kana);font-size:3rem;line-height:1;color:var(--accent)}
.home-head h1{font-size:1.5rem;font-weight:700}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.choice .k{font-family:var(--f-kana);font-size:2.2rem;line-height:1;width:2.6rem;text-align:center;color:var(--accent);flex:none}
.choice b{display:block;font-size:1.1rem}
.choice .sub{color:var(--muted);font-size:.9rem}
.choice.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.main .k,.choice.main .sub{color:var(--accent-ink)}
.choice.main .sub{opacity:.85}
.home-foot{margin-top:18px;color:var(--muted);font-size:.85rem;text-align:center}

/* quiz */
.quiz{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "fb" "pad"}
.quiz>.side{grid-area:side;min-width:0}
.quiz>.padwrap{grid-area:pad}
.quiz>.fbslot{grid-area:fb;min-width:0}
@media (min-width:860px) and (orientation:landscape){.quiz{grid-template-columns:minmax(280px,1fr) minmax(0,1.3fr);grid-template-areas:"side pad" "fb pad";align-items:start;grid-template-rows:auto 1fr}}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prompt .it{font-size:1.45rem;font-weight:650;line-height:1.2}
.prompt .ro{font-size:1rem;letter-spacing:.05em;color:var(--muted)}
.cells{display:flex;gap:8px;flex-wrap:wrap}
.ref{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:.9rem}
.ref span{font-family:var(--f-kana);font-size:2rem;color:var(--ink);letter-spacing:.08em;line-height:1.1}
.prompt .seg{align-self:flex-start}
.padwrap{overflow-x:auto}
@media (max-width:600px){.hide-phone{display:none}}
.cell{width:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cell .box{width:54px;height:54px;border-radius:10px;border:1.5px dashed var(--grid);display:flex;align-items:center;justify-content:center;font-family:var(--f-kana);font-size:2rem;line-height:1}
.cell.cur .box{border:2px solid var(--accent);background:var(--accent-soft)}
.cell.ok .box{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
.cell.bad .box{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.cell .syl{font-size:.75rem;color:var(--muted);min-height:1.1em;text-align:center;white-space:nowrap}
@media (max-width:600px){.prompt .it{font-size:1.2rem}.prompt{padding:14px}.cell,.cell .box{width:46px}.cell .box{height:46px;font-size:1.65rem}}
.padwrap{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
canvas.pad{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tools{display:flex;gap:8px;justify-content:center;width:100%}
.fb{border-radius:12px;padding:11px 14px;font-weight:550}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.tip{background:var(--tip-soft);color:var(--tip)}
.fb.info{background:var(--accent-soft);color:var(--accent)}
.done{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.done .k{font-family:var(--f-kana);font-size:2.4rem;line-height:1}

/* alphabet */
.kt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kt.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;min-height:68px;justify-content:center;position:relative}
.kc .k{font-family:var(--f-kana);font-size:1.9rem;line-height:1.1}
.kc .r{font-size:.72rem;color:var(--muted)}
.kc.off{opacity:.45}
.kc.empty{background:transparent;border-color:transparent}
.kc .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:1.05rem}
.testbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}

/* kana sheet */
.sheet-head{display:flex;gap:16px;align-items:center}
.sheet-head .k{font-family:var(--f-kana);font-size:4.6rem;line-height:1;color:var(--accent)}
.sheet-head .r{font-size:1.5rem;font-weight:650}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex .k{font-family:var(--f-kana);font-size:1.35rem;min-width:4.8em}

/* results / settings */
.score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .k{font-family:var(--f-kana);font-size:1.45rem;min-width:4.5em}
.badge{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:42px;padding:0 14px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
.li .t{flex:1;min-width:0}
.rr{gap:10px}
.rk{font-family:var(--f-kana);font-size:1.35rem;line-height:1.2}
.thumb{height:40px;flex:none;max-width:42%;background:var(--bg);border-radius:8px;stroke:var(--ink);fill:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.thumb polyline{fill:none}.thumb .sep{stroke:var(--line);stroke-width:2}
.thumb.empty{display:inline-block;width:40px}
.wbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:44px}
.wbtn .k{font-family:var(--f-kana);font-size:1.45rem;min-width:4.6em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:550;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer}
.study{text-align:center;margin-top:8px}
.study .big{font-family:var(--f-kana);font-size:clamp(3.4rem,14vw,6rem);line-height:1.15;margin:8px 0}
.ask{text-align:center;margin-top:18px}
.ask .mic{width:84px;height:84px;border-radius:50%;border:0;margin:16px auto 6px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.ask .mic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask .mic.on{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.ask .mic.on{animation:none}}
.ask .heard{min-height:1.5em;margin-bottom:10px;color:var(--muted)}
.ask input{flex:1;min-width:0;max-width:260px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:1rem}
.choice .k svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvlbar{height:8px;max-width:240px;margin:6px auto;border-radius:6px;background:var(--line);overflow:hidden}
.lvlbar #lvl{height:100%;width:0;background:var(--ok);transition:width .08s linear}
.diagbox{margin-top:14px;text-align:left;font-size:.8rem;color:var(--muted)}
.diagbox pre{white-space:pre-wrap;word-break:break-all;margin:6px 0 0;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:inherit}
</style>

<div id="app"></div>

<div class="login" id="login" hidden>
  <form class="card" id="login-form">
    <div class="g" aria-hidden="true">ひ</div>
    <h1>Hiragana a mano</h1>
    <p class="muted small" id="login-sub">Accedi per avere gli stessi progressi su iPhone, iPad e computer.</p>
    <input id="login-email" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" minlength="6" required>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn primary" type="submit" id="login-go">Accedi</button>
    <button class="btn" type="button" id="login-new">Crea l'account</button>
    <button class="linkbtn" type="button" id="login-skip" style="margin-top:14px">Continua senza account</button>
  </form>
</div>
<script src="config.js"></script>

          if(r.length>=4){const e=r[r.length-1],q=r[Math.max(0,r.length-6)];const a=Math.atan2(e[1]-q[1],e[0]-q[0]);const x=this.ctx;
            x.save();x.fillStyle=css('--tip');x.beginPath();x.moveTo(e[0]+Math.cos(a)*6,e[1]+Math.sin(a)*6);x.lineTo(e[0]+Math.cos(a+2.5)*6,e[1]+Math.sin(a+2.5)*6);x.lineTo(e[0]+Math.cos(a-2.5)*6,e[1]+Math.sin(a-2.5)*6);x.closePath();x.fill();x.restore();}

      for(let i=0;i<t.d.length;i++){
        if(i<a.i){this.tplStroke(a.ch,i,css('--accent'),5);this.num(a.ch,i,css('--accent'));}
        else if(i===a.i){const L=a.lens[i];this.tplStroke(a.ch,i,css('--accent'),5,{arr:[L,L+2],off:L*(1-a.t)});this.num(a.ch,i,css('--accent'));}

  animate(ch,done){

    const lens=t.raw.map(pathLen);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.anim={ch,i:0,t:0,lens,raf:0};let start=null;const per=i=>Math.max(380,lens[i]*9);
    const step=ts=>{if(!this.anim)return;if(start===null)start=ts;const a=this.anim;let el=ts-start;
      if(reduce){a.i=t.d.length;}else{a.i=0;while(a.i<t.d.length&&el>per(a.i)+180){el-=per(a.i)+180;a.i++;}a.t=Math.min(1,el/per(Math.min(a.i,t.d.length-1)));}

      if(a.i>=t.d.length){this.anim.raf=0;setTimeout(()=>{if(this.anim&&this.anim.ch===ch){this.anim=null;this.draw();done&&done();}},reduce?1500:900);return;}

function fitPad(pad,wrap,reserve){
  const w=wrap.clientWidth||300;const top=pad.c.getBoundingClientRect().top+window.scrollY;
  const availH=window.innerHeight-Math.max(0,top-window.scrollY)-reserve;
  const ps=device.padSize||'l';
  if(pad.cols>1){const maxCell={l:300,m:210,s:140}[ps];let cell=Math.min(Math.floor((w-4)/pad.cols),maxCell,Math.max(availH,120));pad.resize(Math.max(56,cell));return;}
  const max={l:640,m:420,s:280}[ps];let size=Math.min(w,max,Math.max(availH,220));size=Math.max(200,Math.floor(size));pad.resize(size);
}
function reasonText(r,ch){
  switch(r.reason){
    case 'count':return `Tratti: ${ch} ne ha ${r.expected}, tu ne hai fatti ${r.got}.`;
    case 'direction':return `Il tratto ${r.strokes.map(i=>i+1).join(' e ')} va nella direzione opposta.`;
    case 'order':return 'La forma c’è, ma l’ordine dei tratti è sbagliato.';
    case 'similar':return `Somiglia di più a ${r.similar} (${RO[r.similar]}).`;
    default:return r.strokes&&r.strokes.length?`Forma da rivedere: tratto ${r.strokes.map(i=>i+1).join(', ')}.`:'Forma da rivedere.';
  }
}
function badStrokes(r){if(r.reason==='direction'||r.reason==='shape')return r.strokes||[];if(r.reason==='order')return r.perm.map((v,i)=>v!==i?i:-1).filter(i=>i>=0);return [];}

function quizFeedback(){

      <span class="badge ${ok?'ok':'bad'}">${ok?'Giusto':'Da ripassare'}</span></div>
      ${Q.tips.length?`<div class="fb tip" style="margin-top:10px">${esc(Q.tips[0])}</div>`:''}`;}
  if(Q.msg)return `<div class="fb ${Q.msg.type}">${Q.msg.lines?Q.msg.lines.map(esc).join('<br>'):esc(Q.msg.text)}</div>`;
  return '';
}
function checkCell(){
  const c=Q.cells[Q.ci];
  if(!pad.strokes.length){toast('Scrivi prima il kana.');return;}
  const r=check(pad.strokes,c.ch,S.settings.level,ALL_CHARS);
  if(r.ok){
    if(!c.miss)charResult(c.ch,true);
    c.st=c.miss?'bad':'ok';
    Q.draw.push(...pad.strokes.map(st=>st.map(([x,y])=>[x+Q.ci*109,y])));
    if(r.tips.length){Q.tips.push(r.tips[0]);Q.msg={type:'tip',text:'Giusto! '+r.tips[0]};
      Q.phase='tip';Q.lastStrokes=pad.strokes.slice();Q.lastFb={ch:c.ch,ok:true,hl:r.hl};render();return;}
    Q.msg={type:'ok',text:r.quality>.45?'Ottimo!':'Giusto!'};
    pad.fb={ch:c.ch,ok:true};pad.draw();pad.locked=true;
    $('#fbslot').innerHTML=quizFeedback();
    setTimeout(advanceCell,450);
  }else{
    if(!c.miss){charResult(c.ch,false);c.miss=true;}
    Q.phase='bad';Q.msg={type:'bad',text:r.msg};Q.lastStrokes=pad.strokes.slice();Q.lastFb={ch:c.ch,bad:r.hl&&r.hl.length?r.hl:pad.strokes.map((_,i)=>i),showTpl:true,hl:r.hl};save();render();
  }
}
function checkWord(){
  if(!pad.strokes.length){toast('Scrivi prima la parola.');return;}
  const n=Q.cells.length,groups=Array.from({length:n},()=>[]);
  pad.strokes.forEach(st=>{const c=pad.cellOf(st);groups[c].push(st.map(([x,y])=>[x-c*109,y]));});
  const cf=(Q.cellFb||[]).slice(),bad=[],tips=[];const ord=i=>`${i+1}° kana`;
  Q.cells.forEach((c,i)=>{
    if(c.st!=='todo')return;
    if(!groups[i].length){if(!c.miss){charResult(c.ch,false);c.miss=true;}cf[i]={ch:c.ch,state:'bad',showTpl:true};bad.push(`${ord(i)} (${c.ch}): manca, scrivilo nel suo riquadro.`);return;}
    const r=check(groups[i],c.ch,S.settings.level,ALL_CHARS);
    if(r.ok){if(!c.miss)charResult(c.ch,true);c.st=c.miss?'bad':'ok';cf[i]={ch:c.ch,state:'ok',hl:r.tips.length?r.hl:null};if(r.tips.length)tips.push(`${ord(i)} (${c.ch}): ${r.tips[0]}`);}
    else{if(!c.miss){charResult(c.ch,false);c.miss=true;}cf[i]={ch:c.ch,state:'bad',showTpl:true,hl:r.hl};bad.push(`${ord(i)} (${c.ch}): ${r.msg}`);}
  });
  Q.cellFb=cf;Q.wordStrokes=pad.strokes.slice();Q.tips.push(...tips);
  if(bad.length){Q.phase='bad';Q.msg={type:'bad',lines:[...bad,...(tips.length?['Consigli: '+tips.join(' ')]:[])]};save();render();return;}
  if(tips.length){Q.phase='tip';Q.msg={type:'tip',lines:['Giusto! Due ritocchi alla forma:',...tips]};save();render();return;}
  Q.msg={type:'ok',text:'Ottimo!'};save();render();setTimeout(()=>{if(view.name==='quiz'&&Q.phase==='draw')finishItem();},450);
}
function retryWord(){
  Q.phase='draw';Q.msg=null;
  Q.wordStrokes=(Q.wordStrokes||[]).filter(st=>Q.cells[pad.cellOf(st)].st!=='todo');
  Q.cellFb=(Q.cellFb||[]).map((f,i)=>Q.cells[i].st!=='todo'?f:null);render();
}
function advanceCell(){Q.phase='draw';Q.lastStrokes=null;Q.lastFb=null;if(Q.ci<Q.cells.length-1){Q.ci++;render();}else finishItem();}
function finishItem(){
  const ok=!Q.cells.some(c=>c.miss);Q.phase='done';
  if(Q.word)wordResult(Q.item,ok);
  const d=encStrokes(Q.together?(Q.wordStrokes||[]):(Q.draw||[]));
  if(Q.mode==='daily'){S.daily.results.push({item:Q.item,ok,d});S.daily.idx++;}
  else if(Q.mode==='practice'){Q.stats.n++;if(ok)Q.stats.ok++;}
  else if(Q.mode==='rip'){Q.stats.n++;if(ok)Q.stats.ok++;else if(!Q.again.has(Q.item)){Q.again.add(Q.item);Q.list.push(Q.item);}}
  else{Q.stats.n++;if(ok)Q.stats.ok++;else{Q.queue=Q.queue||[];Q.queue.splice(3,0,Q.item);}}
  save();render();speak(Q.item);
}
function nextItem(){
  if(Q.mode==='daily'){
    if(S.daily.idx>=S.daily.items.length){const sc=S.daily.results.filter(r=>r.ok).length;S.history[today()]=Math.max(sc,S.history[today()]??0);save();go('results');return;}
    loadItem(S.daily.items[S.daily.idx]);
  }else if(Q.mode==='practice'||Q.mode==='rip'){
    if(Q.li>=Q.list.length-1){toast(Q.mode==='rip'?`Ripasso finito: ${Q.stats.ok} giuste su ${Q.stats.n}. Gli errori tornano domani.`:`Finite! ${Q.stats.ok} giuste su ${Q.stats.n}.`);go(Q.mode==='rip'?'home':'alpha');return;}

  }else loadItem(nextTraining());

}

let SQ=null;
function readWeight(k){const r=S.read[k];let w=r?3:9;if(r&&r.n)w+=8*(1-r.ok/r.n);if(r&&Date.now()-r.last<10*60e3)w*=.15;return w;}
function nextStudy(){const recent=SQ?SQ.recent:[];
  const useWord=Math.random()<.65;
  if(useWord){const w=wpick(availWords(),x=>readWeight(x.k),x=>recent.includes(x.k));if(w)return w.k;}
  return wpick(unlockedChars(),readWeight,x=>recent.includes(x))||unlockedChars()[0];}
function startStudy(){SQ={ok:0,n:0,recent:[]};loadStudy(nextStudy());go('study');}
function loadStudy(item){SQ.item=item;SQ.w=WORD_MAP[item]||null;SQ.step='read';SQ.res={};SQ.heard={};SQ.partial='';SQ.listening=false;SQ.typed='';SQ.self=false;SQ.anyAnswer=false;SQ.recorded=undefined;SQ.note='';SQ.msg=null;
  SQ.recent.push(item);if(SQ.recent.length>8)SQ.recent.shift();}
function studyRecord(){const ok=SQ.res.read==='ok'&&(!SQ.w||SQ.res.mean==='ok');const r=S.read[SQ.item]||(S.read[SQ.item]={n:0,ok:0,last:0});
  if(SQ.recorded){if(SQ.recorded!==ok){r.ok+=ok?1:-1;SQ.ok+=ok?1:-1;}}else{r.n++;if(ok)r.ok++;SQ.n++;if(ok)SQ.ok++;}
  SQ.recorded=ok;r.last=Date.now();save();}

    ${step==='done'?`<div class="row" style="justify-content:center;gap:8px;margin-top:6px"><span style="font-size:1.15rem;font-weight:650">${w?esc(w.it):(KANA_WORD[it]?esc(KANA_WORD[it]):'kana')}</span>${badge('mean')}</div>`:''}
  </section>
  ${step!=='done'?`<div class="ask"><b>${ask}</b>

    micListen(lang,t=>{SQ.partial=t;const h=$('.heard');if(h)h.textContent=t||'Ti ascolto…';},
      texts=>{SQ.listening=false;studyAnswer(texts,false);},
      (err,det)=>{SQ.listening=false;SQ.msg=err==='silence'?{t:'info',x:'Dal microfono non arriva voce ('+det+'). Controlla che il microfono giusto sia attivo e parla più vicino; sotto, in Diagnostica, c\u2019è il dettaglio.'}
        :err==='unclear'?{t:'info',x:'Ti ho sentito ma non ho capito la parola. Riprova, scandendo piano.'}
        :err==='asr'?{t:'bad',x:'Errore nel riconoscimento: '+det}
        :err==='nomic'?{t:'bad',x:'Nessun microfono trovato ('+det+').'}
        :err==='audio'?{t:'bad',x:'Il microfono non parte: '+det}
        :err==='empty'?{t:'info',x:'Non ho sentito niente. Riprova, parlando vicino al microfono.'}
        :err==='not_granted'?{t:'info',x:'Il microfono non è permesso qui. Puoi scrivere la risposta, o dirla ad alta voce e toccare Mostra.'}
        :err==='unavailable'?{t:'info',x:lang==='ja'?'Qui la dettatura in giapponese non c’è. Scrivi la lettura in romaji, o dilla e tocca Mostra.':'Qui la dettatura non c’è. Scrivi la risposta.'}
        :{t:'info',x:'Il microfono non ha funzionato. Riprova o scrivi la risposta.'};render();});
    render();};
}
async function studyAnswer(texts,typed){
  const step=SQ.step,it=SQ.item,w=SQ.w;SQ.anyAnswer=true;SQ.heard[step]=texts[0];
  let v=step==='read'?judgeReading(texts,it):judgeMeaning(texts,w.it),note='';
  if(v==='unsure'){SQ.msg={t:'info',x:'Controllo…'};render();const j=await askJudge(step==='read'?'read':'mean',it,texts[0]);
    if(SQ.item!==it||SQ.step!==step)return;
    if(j){v=j.ok?'ok':'no';note=j.nota||'';}
    else if(!typed){SQ.confirm={step,heard:texts[0]};SQ.msg=null;render();return;}
    else v='no';}
  studyResolve(step,v,note,typed,texts[0]);
}
function studyResolve(step,v,note,typed,heard){
  const it=SQ.item,w=SQ.w;SQ.confirm=null;
  if(v==='no'&&heard&&!SQ.force){SQ.fail={step,heard,note};SQ.msg=null;SQ.listening=false;render();return;}
  SQ.force=false;SQ.fail=null;
  SQ.res[step]=v;SQ.msg=null;SQ.note=note;
  if(step==='read'){setTimeout(()=>speak(it),250);if(w){SQ.step='mean';SQ.msg=v==='ok'?{t:'ok',x:`Giusto: ${w.ro}.`}:{t:'bad',x:`Si legge ${w.ro}${typed?'':` (ho sentito «${heard}»)`}. Ascoltala e ripetila.`};render();return;}}
  SQ.step='done';studyRecord();render();
}

    ${TTS?`<div class="li"><div class="t"><b>Quale voce</b><div class="muted small">Claude ha una voce più naturale, ma c'è solo su computer (Chrome o Edge).</div></div>
      <div class="seg">${[['sys','Sistema'],['claude','Claude']].map(([k,l])=>`<button data-vc="${k}" aria-pressed="${(st.voice||'sys')===k}">${l}</button>`).join('')}</div></div>`:''}

<script type="module">
const cfg=window.HIRA_FIREBASE;
if(cfg&&cfg.apiKey){
  const V='https://www.gstatic.com/firebasejs/12.19.0/';
  const [{initializeApp},A,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
  const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
  const $=id=>document.getElementById(id),box=$('login'),err=$('login-err');
  const MSG={'auth/invalid-credential':'Email o password sbagliate.','auth/wrong-password':'Password sbagliata.','auth/user-not-found':'Nessun account con questa email.','auth/email-already-in-use':'Esiste già un account con questa email: usa Accedi.','auth/weak-password':'Password troppo corta: almeno 6 caratteri.','auth/invalid-email':'Email non valida.','auth/network-request-failed':'Sei senza rete. Riprova, o continua senza account.','auth/too-many-requests':'Troppi tentativi. Riprova tra qualche minuto.','auth/operation-not-allowed':'In Firebase il login con email e password non è attivo.','auth/admin-restricted-operation':'La creazione di nuovi account è disattivata.'};
  const run=async fn=>{err.textContent='';const e=$('login-email').value.trim(),p=$('login-pass').value;if(!e||p.length<6){err.textContent='Scrivi email e password (almeno 6 caratteri).';return;}
    try{await fn(auth,e,p);}catch(x){err.textContent=MSG[x.code]||'Non riuscito ('+(x.code||'errore')+').';}};
  $('login-form').onsubmit=e=>{e.preventDefault();run(A.signInWithEmailAndPassword);};
  $('login-new').onclick=()=>run(A.createUserWithEmailAndPassword);
  $('login-skip').onclick=()=>{try{localStorage.setItem('hira-skip-login','1');}catch(e){}box.hidden=true;};
  window.HIRA_AUTH={email:null,show:()=>{box.hidden=false;},signOut:()=>A.signOut(auth)};
  A.onAuthStateChanged(auth,u=>{
    window.HIRA_AUTH.email=u?u.email:null;
    if(u){const ref=F.doc(db,'users',u.uid,'hiragana','progress');
      window.HIRA_SYNC={get:async()=>{const s=await F.getDoc(ref);return s.exists()?s.data():null;},set:d=>F.setDoc(ref,d)};
      box.hidden=true;dispatchEvent(new Event('hira-sync-ready'));}
    else{window.HIRA_SYNC=null;dispatchEvent(new Event('hira-signed-out'));let skip=false;try{skip=!!localStorage.getItem('hira-skip-login');}catch(e){}box.hidden=skip;}
    if(typeof view!=='undefined'&&view.name==='settings')render();
  });
}
</script>
